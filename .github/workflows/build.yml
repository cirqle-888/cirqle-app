name: Production Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # Must track the Vercel project's runtime (nodeVersion: 24.x),
          # otherwise a green build here says nothing about the real deploy.
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
