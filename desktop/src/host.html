<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    html, body { 
      margin: 0; height: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    body { 
      display: flex; align-items: center; justify-content: space-between; 
      padding: 0 16px; 
      background: #0b1120; /* Very dark blue-gray */
      border-bottom: 1px solid #1e293b;
      color: #e5e7eb; 
      -webkit-user-select: none; user-select: none; 
    }
    
    .group { display: flex; align-items: center; gap: 8px; }
    
    .segmented { 
      display: flex; align-items: center; 
      background: #1e293b; 
      border-radius: 8px; 
      padding: 3px; 
    }
    .segmented button { 
      background: transparent; border: none; 
      padding: 5px 8px; margin: 0; 
      border-radius: 6px; 
      box-shadow: none;
    }
    .segmented button.on { 
      background: #334155; 
      color: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3); 
    }
    .segmented button:hover:not(.on) { background: rgba(255,255,255,0.05); }

    .brand { display: flex; align-items: center; margin-right: 8px; }
    
    button { 
      background: #1e293b; color: #cbd5e1; 
      border: 1px solid #334155; border-radius: 8px; 
      padding: 6px 12px; font-size: 13px; font-weight: 500; 
      cursor: pointer; white-space: nowrap; 
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.15s ease;
    }
    button:hover { background: #334155; color: #f8fafc; border-color: #475569; }
    button:active { transform: scale(0.97); }
    
    button.primary { 
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); 
      border-color: #7c3aed; color: #fff; font-weight: 600; 
      box-shadow: 0 2px 4px rgba(124, 58, 237, 0.25);
    }
    button.primary:hover { 
      background: linear-gradient(135deg, #9366f7 0%, #8b5cf6 100%); 
      box-shadow: 0 4px 6px rgba(124, 58, 237, 0.3);
    }

    button.icon-btn { padding: 6px 8px; }
    button svg { 
      width: 15px; height: 15px; 
      stroke-width: 2.2; stroke: currentColor; fill: none; 
      stroke-linecap: round; stroke-linejoin: round; 
    }
    /* For filled SVGs like the split icons */
    button.icon-btn.split-icon svg { stroke: none; fill: currentColor; }

    /* WhatsApp tabs */
    .wa-tab-wrap { position: relative; display: flex; align-items: center; }
    .wa-tab-wrap button.wa-tab { 
      border-radius: 8px; padding-right: 12px;
      background: #1e293b; border-color: #334155;
    }
    .wa-tab-wrap button.wa-tab.has-close {
      padding-right: 28px;
    }
    .wa-tab-wrap button.wa-tab.on { 
      background: #22c55e; border-color: #16a34a; color: white;
      box-shadow: 0 2px 4px rgba(34, 197, 94, 0.2);
    }
    .wa-tab-wrap button.wa-tab.on:hover { background: #16a34a; }
    
    .wa-close-btn { 
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      background: transparent !important; border: none !important; 
      padding: 4px !important; border-radius: 6px;
      display: flex; opacity: 0.5; color: inherit; box-shadow: none !important;
    }
    .wa-tab-wrap:hover .wa-close-btn { opacity: 0.8; }
    .wa-close-btn:hover { background: rgba(0,0,0,0.15) !important; opacity: 1 !important; }
    .wa-tab-wrap button.wa-tab.on + .wa-close-btn:hover { background: rgba(0,0,0,0.2) !important; color: white; }
    .wa-close-btn svg { width: 12px; height: 12px; }
    
    .sep { width: 1px; height: 20px; background: #334155; margin: 0 2px; }
  </style>
</head>
<body>
  <!-- LEFT: App Brand & Cirqle Actions -->
  <div class="group">
    <div class="brand">
      <img id="app-logo" src="../assets/icon.png" style="height: 24px; width: auto; max-width: 120px; object-fit: contain;" alt="Logo" />
    </div>
    
    <button class="primary" id="cap" title="Create a new request from clipboard">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New Request
    </button>
    
    <div class="sep" style="margin-left: 4px;"></div>
    
    <div class="segmented">
      <button id="btn-back" class="icon-btn" title="Go Back">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button id="btn-forward" class="icon-btn" title="Go Forward">
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button data-reload="cirqle" class="icon-btn" title="Reload Cirqle">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
  </div>

  <!-- CENTER: WhatsApp Tabs -->
  <div class="group">
    <div id="wa-tabs" style="display:flex; gap:6px;"></div>
    <button id="wa-add" class="icon-btn" title="Add another WhatsApp account">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button data-reload="whatsapp" class="icon-btn" title="Reload active WhatsApp">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>

  <!-- RIGHT: View Controls & System -->
  <div class="group">
    <div class="segmented">
      <button data-preset="hideWA" class="icon-btn split-icon" title="Cirqle Only">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
      </button>
      <button data-preset="75" class="icon-btn split-icon" title="Cirqle 75% / WhatsApp 25%">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="12" height="14" rx="2"/>
          <rect x="17" y="5" width="4" height="14" rx="1.5" opacity="0.3"/>
        </svg>
      </button>
      <button data-preset="50" class="icon-btn split-icon" title="Split 50% / 50%">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="8" height="14" rx="2"/>
          <rect x="13" y="5" width="8" height="14" rx="2" opacity="0.3"/>
        </svg>
      </button>
      <button data-preset="25" class="icon-btn split-icon" title="WhatsApp 75% / Cirqle 25%">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="4" height="14" rx="1.5"/>
          <rect x="9" y="5" width="12" height="14" rx="2" opacity="0.3"/>
        </svg>
      </button>
      <button data-preset="hideCirqle" class="icon-btn split-icon" title="WhatsApp Only">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" opacity="0.3"/></svg>
      </button>
    </div>
    
    <div class="sep" style="margin-right: 4px;"></div>
    
    <button id="btn-fullscreen" class="icon-btn" title="Toggle Full Screen">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
    <button data-preset="toggleToolbar" class="icon-btn" title="Hide Toolbar (Cmd/Ctrl+T to show)">
      <svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>
    </button>
  </div>
  
  <script>
    const $ = (s) => document.querySelector(s)
    
    // Bind simple static buttons
    document.querySelectorAll('[data-preset]').forEach((b) => (b.onclick = () => window.desk.preset(b.dataset.preset)))
    document.querySelectorAll('[data-reload]').forEach((b) => (b.onclick = () => window.desk.reload(b.dataset.reload)))
    $('#cap').onclick = () => window.desk.capture()
    $('#btn-back').onclick = () => window.desk.goBack()
    $('#btn-forward').onclick = () => window.desk.goForward()
    $('#btn-fullscreen').onclick = () => window.desk.toggleFullscreen()
    $('#wa-add').onclick = () => window.desk.waAdd()

    // Receive state from main process
    window.desk.onState((s) => {
      // 1. Update Layout Presets
      document.querySelectorAll('[data-preset]').forEach((b) => b.classList.remove('on'))
      let key = null
      if (!s.showWhatsapp) key = 'hideWA'
      else if (!s.showCirqle) key = 'hideCirqle'
      else key = s.ratio < 0.4 ? '25' : s.ratio > 0.6 ? '75' : '50'
      const el = $('[data-preset="' + key + '"]')
      if (el) el.classList.add('on')

      // 2. Update WhatsApp Tabs
      const tabsContainer = $('#wa-tabs')
      tabsContainer.innerHTML = ''
      if (s.waAccounts && s.waAccounts.length > 0) {
        s.waAccounts.forEach(wa => {
          const wrap = document.createElement('div')
          wrap.className = 'wa-tab-wrap'
          
          const btn = document.createElement('button')
          btn.textContent = wa.label
          btn.className = 'wa-tab'
          if (s.waAccounts.length > 1) {
            btn.classList.add('has-close')
          }
          if (s.activeWa === wa.id && s.showWhatsapp) {
            btn.classList.add('on')
          }
          btn.onclick = () => window.desk.waSwitch(wa.id)
          
          // Inline Rename on Right-Click
          btn.oncontextmenu = (e) => {
            e.preventDefault()
            const input = document.createElement('input')
            input.type = 'text'
            input.value = wa.label
            input.style.width = '80px'
            input.style.padding = '4px 8px'
            input.style.fontSize = '12px'
            input.style.border = '1px solid #4B5563'
            input.style.borderRadius = '6px'
            input.style.backgroundColor = '#1F2937'
            input.style.color = 'white'
            input.style.outline = 'none'
            
            const submit = () => {
              if (input.value && input.value.trim() !== '' && input.value !== wa.label) {
                window.desk.waRename(wa.id, input.value.trim())
              } else {
                wrap.replaceChild(btn, input)
              }
            }
            input.onblur = submit
            input.onkeydown = (e) => {
              if (e.key === 'Enter') submit()
              if (e.key === 'Escape') {
                input.value = wa.label
                submit()
              }
            }
            wrap.replaceChild(input, btn)
            input.focus()
            input.select()
          }
          wrap.appendChild(btn)
          
          // Close button (only if > 1 account)
          if (s.waAccounts.length > 1) {
            const closeBtn = document.createElement('button')
            closeBtn.className = 'wa-close-btn'
            closeBtn.title = 'Remove Account'
            closeBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>'
            closeBtn.onclick = () => {
              if (confirm(`Remove WhatsApp account "${wa.label}"?`)) {
                window.desk.waRemove(wa.id)
              }
            }
            wrap.appendChild(closeBtn)
          }
          
          tabsContainer.appendChild(wrap)
        })
      }

      // 3. Update App Logo
      const logoImg = $('#app-logo')
      if (s.logoUrl && logoImg.src !== s.logoUrl) {
        logoImg.src = s.logoUrl
      }
    })
  </script>
</body>
</html>
