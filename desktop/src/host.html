<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    html, body { 
      margin: 0; height: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    body { 
      display: flex; align-items: center; justify-content: space-between; 
      padding: 0 16px; 
      background: #0b1120; /* Very dark blue-gray */
      border-bottom: 1px solid #1e293b;
      color: #e5e7eb; 
      -webkit-user-select: none; user-select: none; 
    }
    
    .group { display: flex; align-items: center; gap: 8px; }
    
    .segmented { 
      display: flex; align-items: center; 
      background: #1e293b; 
      border-radius: 8px; 
      padding: 3px; 
    }
    .segmented button { 
      background: transparent; border: none; 
      padding: 5px 8px; margin: 0; 
      border-radius: 6px; 
      box-shadow: none;
    }
    .segmented button.on { 
      background: #334155; 
      color: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3); 
    }
    .segmented button:hover:not(.on) { background: rgba(255,255,255,0.05); }

    .brand { display: flex; align-items: center; margin-right: 8px; }
    
    button { 
      background: #1e293b; color: #cbd5e1; 
      border: 1px solid #334155; border-radius: 8px; 
      padding: 6px 12px; font-size: 13px; font-weight: 500; 
      cursor: pointer; white-space: nowrap; 
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.15s ease;
    }
    button:hover { background: #334155; color: #f8fafc; border-color: #475569; }
    button:active { transform: scale(0.97); }
    
    button.primary { 
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); 
      border-color: #7c3aed; color: #fff; font-weight: 600; 
      box-shadow: 0 2px 4px rgba(124, 58, 237, 0.25);
    }
    button.primary:hover { 
      background: linear-gradient(135deg, #9366f7 0%, #8b5cf6 100%); 
      box-shadow: 0 4px 6px rgba(124, 58, 237, 0.3);
    }

    button.icon-btn { padding: 6px 8px; }
    /* Active/engaged icon button (e.g. compare mode on) */
    button.icon-btn.active { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    button.icon-btn.active:hover { background: #8b5cf6; }
    button svg { 
      width: 15px; height: 15px; 
      stroke-width: 2.2; stroke: currentColor; fill: none; 
      stroke-linecap: round; stroke-linejoin: round; 
    }
    /* For filled SVGs like the split icons */
    button.icon-btn.split-icon svg { stroke: none; fill: currentColor; }

    /* WhatsApp tabs */
    .wa-tab-wrap { position: relative; display: flex; align-items: center; }
    .wa-tab-wrap button.wa-tab { 
      border-radius: 8px; padding-right: 12px;
      background: #1e293b; border-color: #334155;
    }
    .wa-tab-wrap button.wa-tab.has-close {
      padding-right: 66px; /* room for the mute · pause · remove minis */
    }
    .wa-tab-wrap button.wa-tab.on { 
      background: #22c55e; border-color: #16a34a; color: white;
      box-shadow: 0 2px 4px rgba(34, 197, 94, 0.2);
    }
    .wa-tab-wrap button.wa-tab.on:hover { background: #16a34a; }
    
    .wa-close-btn { 
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      background: transparent !important; border: none !important; 
      padding: 4px !important; border-radius: 6px;
      display: flex; opacity: 0.5; color: inherit; box-shadow: none !important;
    }
    .wa-tab-wrap:hover .wa-close-btn { opacity: 0.8; }
    .wa-close-btn:hover { background: rgba(0,0,0,0.15) !important; opacity: 1 !important; }
    .wa-tab-wrap button.wa-tab.on + .wa-close-btn:hover { background: rgba(0,0,0,0.2) !important; color: white; }
    .wa-close-btn svg { width: 12px; height: 12px; }
    
    .sep { width: 1px; height: 20px; background: #334155; margin: 0 2px; }

    /* Mini per-tab action buttons (mute / pause / close) */
    .wa-mini {
      background: transparent !important; border: none !important;
      padding: 3px !important; border-radius: 5px;
      display: flex; opacity: 0.45; color: inherit; box-shadow: none !important;
    }
    .wa-tab-wrap:hover .wa-mini { opacity: 0.85 }
    .wa-mini:hover { background: rgba(0,0,0,0.18) !important; opacity: 1 !important; }
    .wa-mini svg { width: 12px; height: 12px; }
    .wa-mini.engaged { opacity: 1; color: #fbbf24; }
    .wa-tab-wrap .minis { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: flex; gap: 1px; }
    .wa-tab-wrap button.wa-tab.paused { opacity: 0.55; border-style: dashed; }

    /* Split "+" dropdown */
    .menu {
      position: fixed; top: 44px; z-index: 50;
      background: #111827; border: 1px solid #334155; border-radius: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      min-width: 220px; padding: 5px; display: none;
    }
    .menu.open { display: block; }
    .menu .mi {
      display: flex; align-items: center; gap: 8px; width: 100%;
      background: transparent; border: none; box-shadow: none;
      padding: 7px 10px; border-radius: 7px; font-size: 12.5px; color: #d1d5db;
      justify-content: flex-start;
    }
    .menu .mi:hover { background: #1f2937; color: #fff; }
    .menu .mi[disabled] { opacity: 0.4; pointer-events: none; }
    .menu .mhead { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; padding: 6px 10px 2px; }
    .menu .mdiv { height: 1px; background: #1f2937; margin: 4px 6px; }
    .menu .mi .close-x { margin-left: auto; opacity: 0.6; }

    /* Browser URL bar */
    #web-bar { display: none; align-items: center; gap: 4px; }
    #web-bar input {
      width: 200px; background: #0f172a; color: #e5e7eb;
      border: 1px solid #334155; border-radius: 8px;
      padding: 6px 10px; font-size: 12px; outline: none;
    }
    #web-bar input:focus { border-color: #7c3aed; }
  </style>
</head>
<body>
  <!-- LEFT: App Brand & Cirqle Actions -->
  <div class="group">
    <div class="brand">
      <img id="app-logo" src="../assets/icon.png" style="height: 24px; width: auto; max-width: 120px; object-fit: contain;" alt="Logo" />
    </div>
    
    <button class="primary" id="cap" title="Create a new request from clipboard">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New Request
    </button>
    
    <div class="sep" style="margin-left: 4px;"></div>
    
    <div class="segmented">
      <button id="btn-back" class="icon-btn" title="Go Back">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button id="btn-forward" class="icon-btn" title="Go Forward">
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button data-reload="cirqle" class="icon-btn" title="Reload Cirqle">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>

    <button id="btn-split" class="icon-btn" title="Add a split — 2nd Cirqle, WhatsApp, or Browser (up to 4 panes)">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/><path d="M17.5 10v4M15.5 12h4" stroke="currentColor" fill="none"/></svg>
    </button>
    <div id="web-bar">
      <div class="sep"></div>
      <div class="segmented">
        <button id="web-back" class="icon-btn" title="Browser Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <button id="web-forward" class="icon-btn" title="Browser Forward"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        <button id="web-reload" class="icon-btn" title="Reload Browser"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
      </div>
      <input id="web-url" type="text" spellcheck="false" placeholder="Search or enter address" />
    </div>
  </div>

  <!-- CENTER: WhatsApp Tabs -->
  <div class="group">
    <div id="wa-tabs" style="display:flex; gap:6px;"></div>
    <button id="wa-add" class="icon-btn" title="Add another WhatsApp account">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button data-reload="whatsapp" class="icon-btn" title="Reload active WhatsApp">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>

  <!-- RIGHT: View Controls & System -->
  <div class="group">
    <div class="segmented">
      <button data-preset="hideWA" class="icon-btn split-icon" title="Cirqle Only">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
      </button>
      <button data-preset="75" class="icon-btn split-icon" title="Cirqle 75% / WhatsApp 25%">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="12" height="14" rx="2"/>
          <rect x="17" y="5" width="4" height="14" rx="1.5" opacity="0.3"/>
        </svg>
      </button>
      <button data-preset="50" class="icon-btn split-icon" title="Split 50% / 50%">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="8" height="14" rx="2"/>
          <rect x="13" y="5" width="8" height="14" rx="2" opacity="0.3"/>
        </svg>
      </button>
      <button data-preset="25" class="icon-btn split-icon" title="WhatsApp 75% / Cirqle 25%">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="4" height="14" rx="1.5"/>
          <rect x="9" y="5" width="12" height="14" rx="2" opacity="0.3"/>
        </svg>
      </button>
      <button data-preset="hideCirqle" class="icon-btn split-icon" title="WhatsApp Only">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" opacity="0.3"/></svg>
      </button>
    </div>
    
    <div class="sep" style="margin-right: 4px;"></div>

    <button id="btn-notifs" class="icon-btn" title="Notifications & chat" style="position:relative;">
      <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span id="notif-badge" style="display:none;position:absolute;top:-2px;right:-2px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:#ef4444;color:#fff;font-size:9px;line-height:14px;font-weight:700;text-align:center;"></span>
    </button>
    <button id="btn-downloads" class="icon-btn" title="Downloaded reports & invoices" style="position:relative;">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      <span id="dl-badge" style="display:none;position:absolute;top:-2px;right:-2px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:#8b5cf6;color:#fff;font-size:9px;line-height:14px;font-weight:700;text-align:center;"></span>
    </button>
    <button id="btn-fullscreen" class="icon-btn" title="Toggle Full Screen">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
    <button data-preset="toggleToolbar" class="icon-btn" title="Hide Toolbar (Cmd/Ctrl+T to show)">
      <svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>
    </button>
  </div>
  
  <script>
    const $ = (s) => document.querySelector(s)

    // Workspace logo: never leave a broken-image glyph. If the pushed URL is
    // dead (e.g. a hashed asset from an old deploy persisted in layout.json),
    // fall back to the bundled app mark.
    const DEFAULT_LOGO = '../assets/icon.png'
    const logoImg = $('#app-logo')
    logoImg.onerror = () => {
      if (!logoImg.src.endsWith('assets/icon.png')) logoImg.src = DEFAULT_LOGO
    }

    // Bind simple static buttons
    document.querySelectorAll('[data-preset]').forEach((b) => (b.onclick = () => window.desk.preset(b.dataset.preset)))
    document.querySelectorAll('[data-reload]').forEach((b) => (b.onclick = () => window.desk.reload(b.dataset.reload)))
    $('#cap').onclick = () => window.desk.capture()
    $('#btn-back').onclick = () => window.desk.goBack()
    $('#btn-forward').onclick = () => window.desk.goForward()
    $('#btn-fullscreen').onclick = () => window.desk.toggleFullscreen()
    $('#btn-downloads').onclick = () => window.desk.toggleDownloads()
    $('#btn-notifs').onclick = () => window.desk.openNotifications()
    $('#wa-add').onclick = () => window.desk.waAdd()

    // ── Split "+" menu — native popup (an HTML dropdown would be clipped by
    // the 48px-tall toolbar view, so main.js builds a real menu) ────────────
    let lastState = null
    $('#btn-split').onclick = () => window.desk.splitMenu()

    // ── Browser URL bar (targets the active web pane) ──────────────────────
    const webBar = $('#web-bar'), webUrl = $('#web-url')
    $('#web-back').onclick = () => lastState?.activeWeb && window.desk.webNav(lastState.activeWeb, 'back')
    $('#web-forward').onclick = () => lastState?.activeWeb && window.desk.webNav(lastState.activeWeb, 'forward')
    $('#web-reload').onclick = () => lastState?.activeWeb && window.desk.webNav(lastState.activeWeb, 'reload')
    webUrl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && lastState?.activeWeb) {
        window.desk.webNav(lastState.activeWeb, 'url', webUrl.value)
        webUrl.blur()
      }
    })

    // Tell main where the ⬇ button is (window coords) so the download "fly"
    // animation knows its landing point. Re-report on resize + layout changes.
    function reportDlBtn() {
      const el = $('#btn-downloads'); if (!el) return
      const r = el.getBoundingClientRect()
      window.desk.reportDownloadBtn({ x: r.left, y: r.top, w: r.width, h: r.height })
    }
    reportDlBtn(); setTimeout(reportDlBtn, 150)
    window.addEventListener('resize', reportDlBtn)

    // A download just landed → pulse the shelf button.
    window.desk.onDownloadsPulse(() => {
      const b = $('#btn-downloads'); if (!b) return
      b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }],
        { duration: 420, easing: 'ease-out' })
    })

    // Downloads badge: count of files saved this session.
    window.desk.onDownloads((d) => {
      const badge = $('#dl-badge')
      if (!badge) return
      const n = (d && d.count) || 0
      badge.textContent = n
      badge.style.display = n > 0 ? 'block' : 'none'
    })

    // Notifications badge: unread chat + alerts, relayed from the Cirqle view.
    window.desk.onNotifBadge((n) => {
      const badge = $('#notif-badge')
      if (!badge) return
      const c = n || 0
      badge.textContent = c > 99 ? '99+' : c
      badge.style.display = c > 0 ? 'block' : 'none'
    })

    // Receive state from main process
    window.desk.onState((s) => {
      lastState = s
      const panes = s.panes || []

      // 1. Update Layout Presets — highlight only when the split IS that preset.
      document.querySelectorAll('[data-preset]').forEach((b) => b.classList.remove('on'))
      let key = null
      const waVisible = panes.some(p => p.startsWith('wa:'))
      if (panes.length === 1) key = panes[0] === 'cirqle' ? 'hideWA' : (panes[0].startsWith('wa:') ? 'hideCirqle' : null)
      else if (panes.length === 2 && panes[0] === 'cirqle' && waVisible)
        key = s.ratio < 0.4 ? '25' : s.ratio > 0.6 ? '75' : '50'
      const el = key && $('[data-preset="' + key + '"]')
      if (el) el.classList.add('on')

      // 1b. Split button lights up whenever more than the basic pair is open.
      const splitBtn = $('#btn-split')
      if (splitBtn) splitBtn.classList.toggle('active', panes.includes('cirqle2') || panes.length > 2)

      // 1c. Browser URL bar — shown while any browser pane is open.
      const showWebBar = panes.some(p => p.startsWith('web:')) && s.activeWeb
      webBar.style.display = showWebBar ? 'flex' : 'none'
      if (showWebBar && document.activeElement !== webUrl) {
        const tab = (s.webTabs || []).find(t => t.id === s.activeWeb)
        if (tab) webUrl.value = tab.url || ''
      }

      // 2. Update WhatsApp Tabs
      const tabsContainer = $('#wa-tabs')
      tabsContainer.innerHTML = ''
      if (s.waAccounts && s.waAccounts.length > 0) {
        s.waAccounts.forEach(wa => {
          const wrap = document.createElement('div')
          wrap.className = 'wa-tab-wrap'

          const btn = document.createElement('button')
          btn.textContent = wa.label
          btn.className = 'wa-tab has-close'
          if (wa.paused) btn.classList.add('paused')
          if (panes.includes('wa:' + wa.id)) {
            btn.classList.add('on')
          }
          btn.title = wa.paused ? 'Paused — click to load' : ''
          btn.onclick = () => window.desk.waSwitch(wa.id)
          
          // Inline Rename on Right-Click
          btn.oncontextmenu = (e) => {
            e.preventDefault()
            const input = document.createElement('input')
            input.type = 'text'
            input.value = wa.label
            input.style.width = '80px'
            input.style.padding = '4px 8px'
            input.style.fontSize = '12px'
            input.style.border = '1px solid #4B5563'
            input.style.borderRadius = '6px'
            input.style.backgroundColor = '#1F2937'
            input.style.color = 'white'
            input.style.outline = 'none'
            
            const submit = () => {
              if (input.value && input.value.trim() !== '' && input.value !== wa.label) {
                window.desk.waRename(wa.id, input.value.trim())
              } else {
                wrap.replaceChild(btn, input)
              }
            }
            input.onblur = submit
            input.onkeydown = (e) => {
              if (e.key === 'Enter') submit()
              if (e.key === 'Escape') {
                input.value = wa.label
                submit()
              }
            }
            wrap.replaceChild(input, btn)
            input.focus()
            input.select()
          }
          wrap.appendChild(btn)

          // Mini actions: mute · pause · remove (revealed on hover)
          const minis = document.createElement('div')
          minis.className = 'minis'

          const muteBtn = document.createElement('button')
          muteBtn.className = 'wa-mini' + (wa.muted ? ' engaged' : '')
          muteBtn.title = wa.muted ? 'Unmute notifications' : 'Mute — silence this account’s notification sounds'
          muteBtn.innerHTML = wa.muted
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>'
          muteBtn.onclick = (e) => { e.stopPropagation(); window.desk.waMute(wa.id, !wa.muted) }
          minis.appendChild(muteBtn)

          const pauseBtn = document.createElement('button')
          pauseBtn.className = 'wa-mini' + (wa.paused ? ' engaged' : '')
          pauseBtn.title = wa.paused ? 'Resume — load this account' : 'Pause — unload this account (no memory, no notifications)'
          pauseBtn.innerHTML = wa.paused
            ? '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>'
          pauseBtn.onclick = (e) => { e.stopPropagation(); window.desk.waPause(wa.id, !wa.paused) }
          minis.appendChild(pauseBtn)

          if (s.waAccounts.length > 1) {
            const closeBtn = document.createElement('button')
            closeBtn.className = 'wa-mini'
            closeBtn.title = 'Remove Account'
            closeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'
            closeBtn.onclick = (e) => {
              e.stopPropagation()
              if (confirm(`Remove WhatsApp account "${wa.label}"?`)) {
                window.desk.waRemove(wa.id)
              }
            }
            minis.appendChild(closeBtn)
          }
          wrap.appendChild(minis)

          tabsContainer.appendChild(wrap)
        })
      }

      // 3. Update App Logo — an empty logoUrl (workspace has no logo, or the
      // stored one was cleared) resets to the bundled mark.
      if (s.logoUrl && logoImg.src !== s.logoUrl) {
        logoImg.src = s.logoUrl
      } else if (!s.logoUrl && !logoImg.src.endsWith('assets/icon.png')) {
        logoImg.src = DEFAULT_LOGO
      }

      // Layout may have shifted the toolbar → refresh the fly-animation target.
      reportDlBtn()
    })
  </script>
</body>
</html>
