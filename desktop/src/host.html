<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cirqle workspace controls</title>
<style>
:root { color-scheme: dark; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:12px; }
* { box-sizing:border-box; }
body { margin:0; background:#0b1120; color:#e5e7eb; overflow:hidden; user-select:none; }
#toolbar-row { height:48px; display:flex; align-items:center; gap:6px; padding:0 10px; }
.brand { width:24px; height:24px; object-fit:contain; margin-right:3px; }
button { border:1px solid #334155; background:#1e293b; color:#dbe5f1; border-radius:7px; padding:6px 10px; font:inherit; cursor:pointer; white-space:nowrap; }
button:hover { background:#334155; color:white; }
button:focus-visible,input:focus-visible { outline:2px solid #a78bfa; outline-offset:1px; }
button svg { width:14px; height:14px; vertical-align:middle; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
button:disabled { opacity:.35; cursor:default; }
button.active { background:#6d28d9; border-color:#8b5cf6; color:white; }
button.primary { background:#7c3aed; border-color:#8b5cf6; color:white; font-weight:600; }
.spacer { flex:1; min-width:0; }
#btn-wa { max-width:220px; overflow:hidden; text-overflow:ellipsis; background:#123424; border-color:#246847; }
.badge { display:none; padding:1px 5px; border-radius:9px; background:#7c3aed; font-size:10px; margin-left:4px; }
#notif-badge { background:#dc2626; }
#pane-strip { display:flex; height:32px; border-block:1px solid #334155; background:#111827; }
.pane-label { display:flex; align-items:center; min-width:0; padding:0 8px; gap:5px; border-right:1px solid #334155; }
.pane-label.dim { opacity:.55; }
.pane-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; font-weight:500; }
.pane-state { font-size:10px; color:#94a3b8; max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pane-state.saving,.pane-state.loading { color:#c4b5fd; }
.pane-state.error,.pane-state.offline,.pane-state.conflict { color:#fbbf24; }
.pane-label button { padding:2px 5px; border:0; border-radius:4px; background:transparent; font-size:16px; }
.pane-label button.retry { font-size:11px; color:#fbbf24; }
#status-row { height:24px; padding:0 10px; display:flex; align-items:center; gap:10px; color:#94a3b8; font-size:11px; }
#status-message { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
#status-message.error { color:#fbbf24; }
#status-message.success { color:#86efac; }
#update-button { display:none; padding:1px 7px; font-size:11px; background:#3b2463; border-color:#6d28d9; }
#web-bar { display:none; align-items:center; gap:4px; flex:1; max-width:55%; }
#web-bar button { padding:0 6px; }
input { color:#f8fafc; background:#0f172a; border:1px solid #475569; border-radius:6px; font:inherit; padding:5px 7px; min-width:0; }
#web-url { flex:1; padding:2px 6px; }
#name-form { display:none; align-items:center; gap:4px; }
#name-input { width:150px; }
@media(max-width:1050px) { .brand,#btn-back,#btn-forward { display:none; } #btn-wa { max-width:150px; } button { padding:6px 8px; } .pane-state { max-width:75px; } }
</style>
</head>
<body>
<div id="toolbar-row">
<img id="app-logo" class="brand" src="../assets/icon.png" alt="Cirqle">
<button id="cap" class="primary" title="Create a request from copied text">＋ New request</button>
<button id="btn-back" aria-label="Go back in Cirqle">‹</button>
<button id="btn-forward" aria-label="Go forward in Cirqle">›</button>
<button id="btn-studio" title="Open Flyer Cirqle; Option-click opens a second Flyer">Flyer</button>
<button id="btn-split" title="Add a pane">＋ Pane</button>
<button id="btn-client" title="Choose a client and open their tasks, invoices and Flyers">Client workspace</button>
<button id="btn-layouts" title="Choose or save a workspace layout">Layouts ▾</button>
<form id="name-form"><input id="name-input" maxlength="60" aria-label="Name"><button type="submit">Save</button><button type="button" id="name-cancel" aria-label="Cancel">×</button></form>
<div class="spacer"></div>
<button id="btn-wa" title="Switch or manage WhatsApp accounts">WhatsApp ▾</button>
<button id="btn-notifs" title="Notifications and chat" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg><span id="notif-badge" class="badge"></span></button>
<button id="btn-downloads" title="Common downloads" aria-label="Downloads">↓<span id="dl-badge" class="badge"></span></button>
<button id="btn-more" title="Reload, equal widths, full screen, updates" aria-label="More options">•••</button>
</div>
<div id="pane-strip" aria-label="Open panes"></div>
<div id="status-row">
<div id="web-bar"><button id="web-back" aria-label="Browser back">‹</button><button id="web-forward" aria-label="Browser forward">›</button><button id="web-reload" aria-label="Reload browser">↻</button><input id="web-url" aria-label="Browser address" placeholder="Search or enter address" spellcheck="false"></div>
<button id="btn-client-chat" style="display:none;padding:1px 7px;font-size:11px" title="Open a contact chat or copy the client name for WhatsApp search">Client chat</button>
<span id="status-message" role="status" aria-live="polite">Ready</span>
<button id="update-button">Update available</button>
</div>
<script>
const $ = s => document.querySelector(s)
let lastState = null, lastUpdate = null, messageTimer = null, promptAccount = null
const logo = $('#app-logo'), defaultLogo = '../assets/icon.png'
logo.onerror = () => { if (!logo.src.endsWith('assets/icon.png')) logo.src = defaultLogo }
$('#cap').onclick = () => window.desk.capture()
$('#btn-back').onclick = () => window.desk.goBack()
$('#btn-forward').onclick = () => window.desk.goForward()
$('#btn-split').onclick = () => window.desk.splitMenu()
$('#btn-client').onclick = () => window.desk.selectClientWorkspace()
$('#btn-client-chat').onclick = () => window.desk.clientChat()
$('#btn-layouts').onclick = () => window.desk.workspaceMenu()
$('#btn-wa').onclick = () => window.desk.waMenu()
$('#btn-more').onclick = () => window.desk.moreMenu()
$('#btn-notifs').onclick = () => window.desk.openNotifications()
$('#btn-downloads').onclick = () => window.desk.toggleDownloads()
$('#btn-studio').onclick = e => {
 const pane = e.altKey ? 'studio2' : 'studio'
 if (lastState?.panes.includes(pane)) window.desk.splitClose(pane)
 else window.desk.splitAdd({kind:pane})
}
function showMessage(text, kind = '', duration = 12000) {
 clearTimeout(messageTimer)
 $('#status-message').textContent = text
 $('#status-message').className = kind
 messageTimer = setTimeout(() => { messageTimer = null; showDefaultMessage() },duration)
}
function showDefaultMessage() {
 if (messageTimer) return
 const cramped = lastState?.panes.length > 2 && innerWidth < 1150
 $('#status-message').textContent = cramped ? 'Need more room? Use ↗ to expand a pane.' : 'Choose Layouts to save your workspace. Sharing opens a draft for review.'
 $('#status-message').className = ''
}
function showNameForm(account = null) {
 promptAccount = account
 $('#name-form').style.display = 'flex'
 $('#btn-layouts').style.display = 'none'
 $('#btn-back').style.display = 'none'
 $('#btn-forward').style.display = 'none'
 $('#name-input').value = account?.label || ''
 $('#name-input').placeholder = account ? 'Account name' : 'Layout name'
 $('#name-input').setAttribute('aria-label', account ? 'Account name' : 'Layout name')
 $('#name-input').focus()
}
function closeNameForm() {
 $('#name-form').style.display = 'none'
 $('#btn-layouts').style.display = ''
 $('#btn-back').style.display = ''
 $('#btn-forward').style.display = ''
 $('#btn-layouts').focus()
}
$('#name-cancel').onclick = closeNameForm
$('#name-input').onkeydown = e => { if (e.key === 'Escape') { e.preventDefault(); closeNameForm() } }
$('#name-form').onsubmit = async e => {
 e.preventDefault()
 const name = $('#name-input').value.trim()
 if (!name) { showMessage('Enter a name to save.', 'error'); return }
 if (promptAccount) { window.desk.waRename(promptAccount.id,name); closeNameForm(); return }
 try {
 const result = await window.desk.saveWorkspace(name)
 if (result?.ok) { showMessage('Layout saved: ' + result.name,'success'); closeNameForm() }
 else showMessage(result?.reason || 'Could not save layout.', 'error')
 } catch { showMessage('Could not save layout. Try again.', 'error') }
}
window.desk.onWorkspacePrompt(() => showNameForm())
window.desk.onRenamePrompt(account => showNameForm(account))
window.desk.onShareStatus(status => showMessage(status.message, status.ok === false ? 'error' : 'success', 20000))
window.desk.onUpdateStatus(status => {
 lastUpdate = status
 $('#update-button').style.display = status.available ? 'block' : 'none'
 $('#update-button').textContent = status.label || 'Update available'
 if (status.message) showMessage(status.message, status.error ? 'error' : '')
})
$('#update-button').onclick = () => window.desk.updateAction(lastUpdate?.ready ? 'install' : 'check')
for (const op of ['back','forward','reload']) $('#web-'+op).onclick = () => lastState?.activeWeb && window.desk.webNav(lastState.activeWeb,op)
$('#web-url').onkeydown = e => { if (e.key === 'Enter' && lastState?.activeWeb) { window.desk.webNav(lastState.activeWeb,'url',e.target.value); e.target.blur() } }
function badge(selector,count) {
 const node = $(selector), value = Math.max(0,Number(count)||0)
 node.textContent = value > 99 ? '99+' : String(value)
 node.style.display = value > 0 ? 'inline-block' : 'none'
}
window.desk.onNotifBadge(n => badge('#notif-badge',n))
window.desk.onDownloads(d => badge('#dl-badge',d?.count))
window.desk.onDownloadsPulse(() => $('#btn-downloads').animate([{transform:'scale(1)'},{transform:'scale(1.2)'},{transform:'scale(1)'}],{duration:400}))
function reportDlBtn() { const r = $('#btn-downloads').getBoundingClientRect(); window.desk.reportDownloadBtn({x:r.x,y:r.y,w:r.width,h:r.height}) }
function paneName(pane,s) {
 if (s.clientWorkspace?.roles?.[pane]) return s.clientWorkspace.roles[pane]
 return ({cirqle:'Cirqle',cirqle2:'Cirqle · compare',studio:'Flyer Cirqle',studio2:'Flyer Cirqle · 2'})[pane]
 || (pane.startsWith('wa:') ? 'WhatsApp · ' + (s.waAccounts.find(a => a.id === pane.slice(3))?.label || '') : s.webTabs.find(t => t.id === pane.slice(4))?.label || 'Browser')
}
window.desk.onState(s => {
 lastState = s
 $('#btn-client').textContent = s.clientWorkspace ? s.clientWorkspace.code || 'Client workspace' : 'Client workspace'
 $('#btn-client').title = s.clientWorkspace ? 'Change client: '+s.clientWorkspace.name : 'Choose a client workspace'
 $('#btn-client').classList.toggle('active',!!s.clientWorkspace)
 $('#btn-client-chat').style.display = s.clientWorkspace ? '' : 'none'
 const panes = s.panes || [], strip = $('#pane-strip')
 strip.replaceChildren()
 panes.forEach((pane,i) => {
  const item = document.createElement('div')
  item.className = 'pane-label' + (s.expandedPane && s.expandedPane !== pane ? ' dim' : '')
  item.style.flex = String(s.sizes?.[i] || 1/panes.length)
  item.dataset.pane = pane
  const title = document.createElement('span'); title.className = 'pane-name'; title.textContent = paneName(pane,s); title.title = title.textContent
  item.appendChild(title)
  const health = s.paneStatus?.[pane], save = s.saveStatus?.[pane]
  const status = health && health.state !== 'ready' ? health : save?.state !== 'idle' && save ? save : health
  if (status && status.state !== 'ready') {
   const text = document.createElement('span'); text.className = 'pane-state '+status.state
   text.textContent = status.label || ({saving:'Saving…',saved:'Saved',error:'Not saved',conflict:'Review edits'})[status.state] || ''
   text.title = text.textContent; item.appendChild(text)
  }
  if (health && ['error','offline'].includes(health.state)) {
   const retry = document.createElement('button'); retry.textContent = 'Retry'; retry.className = 'retry'; retry.setAttribute('aria-label','Retry '+title.textContent)
   retry.onclick = () => window.desk.retryPane(pane); item.appendChild(retry)
  }
  const expand = document.createElement('button'); expand.textContent = s.expandedPane === pane ? '↙' : '↗'
  expand.title = (s.expandedPane === pane ? 'Restore layout' : 'Expand '+title.textContent)
  expand.setAttribute('aria-label',expand.title); expand.setAttribute('aria-pressed',String(s.expandedPane === pane))
  expand.onclick = () => window.desk.expandPane(pane); item.appendChild(expand)
  const close = document.createElement('button'); close.textContent = '×'; close.title = 'Close '+title.textContent; close.setAttribute('aria-label',close.title)
  close.disabled = panes.length === 1 && pane === 'cirqle'
  close.onclick = () => window.desk.splitClose(pane); item.appendChild(close)
  strip.appendChild(item)
 })
 const flyer = $('#btn-studio'); flyer.classList.toggle('active',panes.includes('studio')||panes.includes('studio2'))
 flyer.title = (panes.includes('studio') ? 'Close Flyer Cirqle' : 'Open Flyer Cirqle') + ' · Option-click for a second Flyer'
 const account = s.waAccounts?.find(a=>a.id===s.activeWa)
 $('#btn-wa').textContent = 'WhatsApp · '+(account?.label || 'Accounts')+' ▾'
 $('#btn-wa').title = 'Active sharing account: '+(account?.label || 'None')+'. Switch or manage accounts.'
 if (s.logoUrl) logo.src = s.logoUrl
 const showWeb = panes.some(p=>p.startsWith('web:')) && s.activeWeb
 $('#web-bar').style.display = showWeb ? 'flex' : 'none'
 if (showWeb && document.activeElement !== $('#web-url')) $('#web-url').value = s.webTabs.find(t=>t.id===s.activeWeb)?.url || ''
 showDefaultMessage(); reportDlBtn()
})
window.addEventListener('resize',reportDlBtn)
reportDlBtn()
</script>
</body>
</html>
