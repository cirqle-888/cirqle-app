<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #0b1120; color: #e5e7eb; -webkit-user-select: none; user-select: none; }
    .brand { font-weight: 800; font-size: 14px; color: #fff; margin-right: 6px; white-space: nowrap; }
    .brand span { color: #8b5cf6; }
    button { background: #1f2937; color: #e5e7eb; border: 1px solid #334155; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    button:hover { background: #374151; }
    button.on { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    .primary { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    .sep { width: 1px; height: 22px; background: #334155; margin: 0 4px; }
    .grow { flex: 1; }
    .ver { font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <div class="brand">cirqle<span>.</span> desktop</div>
  <button class="primary" id="cap">➕ New request from clipboard</button>
  <div class="sep"></div>
  <button data-preset="50">50 / 50</button>
  <button data-preset="75">Cirqle 75</button>
  <button data-preset="25">WhatsApp 75</button>
  <button data-preset="hideWA">Hide WhatsApp</button>
  <button data-preset="hideCirqle">Hide Cirqle</button>
  <div class="sep"></div>
  <button data-reload="cirqle">⟳ Cirqle</button>
  <button data-reload="whatsapp">⟳ WhatsApp</button>
  <div class="grow"></div>
  <span class="ver" id="ver"></span>
  <script>
    const $ = (s) => document.querySelector(s)
    document.querySelectorAll('[data-preset]').forEach((b) => (b.onclick = () => window.desk.preset(b.dataset.preset)))
    document.querySelectorAll('[data-reload]').forEach((b) => (b.onclick = () => window.desk.reload(b.dataset.reload)))
    $('#cap').onclick = () => window.desk.capture()
    window.desk.version().then((v) => ($('#ver').textContent = 'v' + v))
    window.desk.onState((s) => {
      document.querySelectorAll('[data-preset]').forEach((b) => b.classList.remove('on'))
      let key = null
      if (!s.showWhatsapp) key = 'hideWA'
      else if (!s.showCirqle) key = 'hideCirqle'
      else key = s.ratio < 0.4 ? '25' : s.ratio > 0.6 ? '75' : '50'
      const el = $('[data-preset="' + key + '"]')
      if (el) el.classList.add('on')
    })
  </script>
</body>
</html>
