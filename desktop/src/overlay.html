<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; cursor: col-resize; -webkit-user-select: none; user-select: none; }
  </style>
</head>
<body>
  <script>
    // Floated over both panes only while dragging, so mouse events keep flowing
    // even as the pointer passes over the web views.
    document.addEventListener('mousemove', (e) => window.desk.splitterDrag(e.screenX))
    document.addEventListener('mouseup', () => window.desk.splitterEnd())
    window.addEventListener('blur', () => window.desk.splitterEnd())
  </script>
</body>
</html>
