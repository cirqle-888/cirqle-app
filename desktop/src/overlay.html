<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; cursor: col-resize; -webkit-user-select: none; user-select: none; }
  </style>
</head>
<body>
  <script>
    // Floated over all panes only while dragging, so mouse events keep flowing
    // even as the pointer passes over the web views. Which splitter is being
    // dragged rides in as ?i=<index> (boundary between pane i and pane i+1).
    const i = Number(new URLSearchParams(location.search).get('i') || 0)
    document.addEventListener('mousemove', (e) => window.desk.splitterDrag(i, e.screenX))
    document.addEventListener('mouseup', () => window.desk.splitterEnd())
    window.addEventListener('blur', () => window.desk.splitterEnd())
  </script>
</body>
</html>
