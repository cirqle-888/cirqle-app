<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b1120; color: #e5e7eb; display: flex; align-items: center; justify-content: center; }
    .box { text-align: center; max-width: 460px; padding: 24px; }
    h2 { margin: 0 0 10px; font-size: 18px; color: #fff; }
    p { font-size: 13px; color: #9ca3af; line-height: 1.7; }
    code { background: #1f2937; padding: 2px 6px; border-radius: 6px; font-size: 12px; }
    button { margin-top: 16px; background: #7c3aed; color: #fff; border: none; border-radius: 8px; padding: 9px 18px; font-size: 13px; cursor: pointer; }
    button:hover { background: #6d28d9; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Couldn’t load this pane</h2>
    <p id="msg"></p>
    <button id="retry">Retry</button>
  </div>
  <script>
    const p = new URLSearchParams(location.search)
    const url = p.get('url') || ''
    const pane = p.get('pane') || 'cirqle'
    const local = url.includes('localhost') || url.includes('127.0.0.1')
    document.getElementById('msg').innerHTML =
      'Tried to open <code>' + url + '</code>.' +
      (local
        ? '<br/><br/>Your local dev server may not be running. Start it with <code>npm run dev</code> in the cirqle-app project, or relaunch the desktop app with <code>npm start</code> to use the live site.'
        : '<br/><br/>Check your internet connection, then retry.')
    function doRetry() {
      if (window.desk && window.desk.retry) window.desk.retry(pane)
      else if (window.__CIRQLE_DESKTOP__ && window.__CIRQLE_DESKTOP__.retry) window.__CIRQLE_DESKTOP__.retry(pane)
    }
    document.getElementById('retry').onclick = doRetry
  </script>
</body>
</html>
