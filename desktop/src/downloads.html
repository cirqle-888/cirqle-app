<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: #0b1120; color: #e5e7eb;
      border: 1px solid #1e293b; border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      -webkit-user-select: none; user-select: none;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-bottom: 1px solid #1e293b; flex-shrink: 0;
    }
    header .title { font-size: 13px; font-weight: 700; letter-spacing: 0.02em; }
    header .actions { display: flex; align-items: center; gap: 4px; }
    .hbtn {
      background: transparent; border: none; color: #94a3b8; cursor: pointer;
      font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px;
    }
    .hbtn:hover { background: #1e293b; color: #f8fafc; }

    .list { flex: 1; overflow-y: auto; padding: 6px; }
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #64748b; gap: 8px; }
    .empty svg { width: 34px; height: 34px; stroke: #475569; stroke-width: 1.6; fill: none; }
    .empty p { font-size: 12px; margin: 0; }

    .item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px; border-radius: 10px;
    }
    .item:hover { background: #111a2e; }
    .thumb {
      width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0;
      background: #1e293b; display: flex; align-items: center; justify-content: center;
      overflow: hidden; border: 1px solid #263449;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb .ext { font-size: 10px; font-weight: 800; color: #93a4bd; text-transform: uppercase; }
    .meta { flex: 1; min-width: 0; }
    .name { font-size: 12.5px; font-weight: 600; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font-size: 10.5px; color: #7c8aa3; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.03em; }
    .badge.cirqle { background: rgba(139,92,246,0.18); color: #c4b5fd; }
    .badge.whatsapp { background: rgba(34,197,94,0.18); color: #86efac; }
    .bar { height: 3px; border-radius: 2px; background: #1e293b; margin-top: 5px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: #8b5cf6; width: 0%; transition: width 0.15s ease; }

    .row-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .row-actions button {
      background: transparent; border: none; cursor: pointer; color: #8595ad;
      padding: 5px; border-radius: 6px; display: flex;
    }
    .row-actions button:hover { background: #1e293b; color: #f8fafc; }
    .row-actions button.wa:hover { color: #22c55e; }
    .row-actions button.rm:hover { color: #f87171; }
    .row-actions svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <header>
    <span class="title">Downloads</span>
    <div class="actions">
      <button class="hbtn" id="open-folder" title="Open the Cirqle downloads folder">Open Folder</button>
      <button class="hbtn" id="clear" title="Clear the list">Clear</button>
      <button class="hbtn" id="close" title="Close">✕</button>
    </div>
  </header>
  <div class="list" id="list"></div>

  <script>
    const $ = (s) => document.querySelector(s)
    const list = $('#list')

    const ICONS = {
      open:   '<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>',
      reveal: '<svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>',
      copy:   '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      wa:     '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>',
      rm:     '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
    }

    function fmtSize(n) {
      if (!n) return ''
      if (n < 1024) return n + ' B'
      if (n < 1048576) return (n / 1024).toFixed(0) + ' KB'
      return (n / 1048576).toFixed(1) + ' MB'
    }
    function fmtWhen(ts) {
      const d = Date.now() - ts
      if (d < 60000) return 'just now'
      if (d < 3600000) return Math.floor(d / 60000) + ' min ago'
      if (d < 86400000) return Math.floor(d / 3600000) + ' h ago'
      return new Date(ts).toLocaleDateString()
    }
    function extOf(name) { const m = /\.([a-z0-9]+)(\?|#|$)/i.exec(name || ''); return m ? m[1] : 'file' }

    function render(items) {
      list.innerHTML = ''
      if (!items || !items.length) {
        list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><p>No downloads yet</p></div>'
        return
      }
      for (const it of items) {
        const el = document.createElement('div')
        el.className = 'item'

        const thumb = document.createElement('div')
        thumb.className = 'thumb'
        // Let the whole row own the drag (below) — not the inner <img>.
        if (it.thumb) { const img = document.createElement('img'); img.src = it.thumb; img.draggable = false; thumb.appendChild(img) }
        else { const s = document.createElement('span'); s.className = 'ext'; s.textContent = extOf(it.name); thumb.appendChild(s) }
        el.appendChild(thumb)

        const meta = document.createElement('div')
        meta.className = 'meta'
        const name = document.createElement('div'); name.className = 'name'; name.textContent = it.name; name.title = it.name
        const sub = document.createElement('div'); sub.className = 'sub'
        const badge = document.createElement('span'); badge.className = 'badge ' + (it.source === 'whatsapp' ? 'whatsapp' : 'cirqle')
        badge.textContent = it.source === 'whatsapp' ? 'WhatsApp' : 'Cirqle'
        sub.appendChild(badge)
        const info = document.createElement('span')
        info.textContent = it.done ? [fmtSize(it.size), fmtWhen(it.at)].filter(Boolean).join(' · ') : 'Downloading…'
        sub.appendChild(info)
        meta.appendChild(name); meta.appendChild(sub)
        if (!it.done) {
          const bar = document.createElement('div'); bar.className = 'bar'
          const span = document.createElement('span')
          span.style.width = it.total ? Math.min(100, Math.round((it.received / it.total) * 100)) + '%' : '40%'
          bar.appendChild(span); meta.appendChild(bar)
        }
        el.appendChild(meta)

        if (it.done) {
          // Native OS drag-out: drag this file straight into WhatsApp, Finder, or any app.
          el.draggable = true
          el.style.cursor = 'grab'
          el.title = 'Drag to WhatsApp, Finder, or anywhere'
          el.addEventListener('dragstart', (e) => { e.preventDefault(); window.desk.dlStartDrag(it.id) })

          const acts = document.createElement('div'); acts.className = 'row-actions'
          const mk = (icon, title, cls, fn) => { const b = document.createElement('button'); if (cls) b.className = cls; b.title = title; b.innerHTML = icon; b.onclick = fn; return b }
          acts.appendChild(mk(ICONS.open, 'Open', '', () => window.desk.dlOpen(it.id)))
          acts.appendChild(mk(ICONS.reveal, 'Show in Folder', '', () => window.desk.dlReveal(it.id)))
          acts.appendChild(mk(ICONS.copy, it.isImage ? 'Copy image' : 'Copy file path', '', () => window.desk.dlCopy(it.id)))
          acts.appendChild(mk(ICONS.wa, 'Share to Linked WhatsApp', 'wa', () => window.desk.dlShareWA(it.id)))
          acts.appendChild(mk(ICONS.rm, 'Remove from list', 'rm', () => window.desk.dlRemove(it.id)))
          el.appendChild(acts)
        }
        list.appendChild(el)
      }
    }

    $('#open-folder').onclick = () => window.desk.dlOpenFolder()
    $('#clear').onclick = () => window.desk.dlClear()
    $('#close').onclick = () => window.desk.closeDownloads()
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.desk.closeDownloads() })

    window.desk.onDownloadsList(render)
  </script>
</body>
</html>
