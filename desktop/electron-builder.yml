appId: work.cirqle.desktop
productName: Cirqle Desktop
directories:
  output: dist
# Package the Electron that is installed and that the checks ran against,
# instead of downloading a copy at build time.
electronDist: node_modules/electron/dist
files:
  - src/**/*
  - assets/**/*
  - package.json
protocols:
  - name: Cirqle
    schemes: [cirqle]
# File associations: none today (web-shell app owns no file type). To add one
# later: declare it here AND register a handler via
# src/main/deeplinks.js registerFileHandler() — the open-file/argv lifecycle
# is already wired through it.
# fileAssociations:
#   - ext: cirqle
#     name: Cirqle Document

mac:
  category: public.app-category.business
  icon: assets/icon.icns
  target: dmg
  # Free build: no Apple Developer account, so no Developer ID. It is signed
  # locally ("ad-hoc", identity "-") rather than left unsigned, because a bundle
  # with a broken seal is reported as "damaged" on an Apple Silicon Mac once it
  # has been downloaded, with no way to open it from System Settings. Signed
  # ad-hoc, macOS says it "could not verify" the app and offers Open Anyway in
  # System Settings → Privacy & Security (the steps are on /download).
  identity: "-"
  # Hardened runtime needs a real team identity: with an ad-hoc signature its
  # library validation refuses Electron's own framework and the app will not
  # start. The signed profile (electron-builder.signed.cjs) turns it back on.
  hardenedRuntime: false
  # Microphone permission (chat voice notes): macOS shows this text in the
  # system dialog; without the key, mic access is silently denied.
  extendInfo:
    NSMicrophoneUsageDescription: "Cirqle uses the microphone to record voice notes in team chat."
dmg:
  title: "Cirqle Workspace Setup"
  icon: assets/icon.icns
  iconSize: 120
  background: assets/background.png
  window:
    width: 800
    height: 500
  contents:
    - x: 200
      y: 340
      type: file
    - x: 600
      y: 340
      type: link
      path: /Applications

win:
  target: nsis
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
