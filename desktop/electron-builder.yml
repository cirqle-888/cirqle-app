appId: work.cirqle.desktop
productName: Cirqle Desktop
directories:
  output: dist
files:
  - src/**/*
  - assets/**/*
  - package.json
protocols:
  - name: Cirqle
    schemes: [cirqle]
# File associations: none today (web-shell app owns no file type). To add one
# later: declare it here AND register a handler via
# src/main/deeplinks.js registerFileHandler() — the open-file/argv lifecycle
# is already wired through it.
# fileAssociations:
#   - ext: cirqle
#     name: Cirqle Document

mac:
  category: public.app-category.business
  icon: assets/icon.icns
  target: dmg
  # Unsigned, free build (no Apple Developer account). Gatekeeper blocks the
  # first launch — see README for the one-time right-click → Open / xattr step.
  identity: null
  # Microphone permission (chat voice notes): macOS shows this text in the
  # system dialog; without the key, mic access is silently denied.
  extendInfo:
    NSMicrophoneUsageDescription: "Cirqle uses the microphone to record voice notes in team chat."
dmg:
  title: "Cirqle Workspace Setup"
  icon: assets/icon.icns
  iconSize: 120
  background: assets/background.png
  window:
    width: 800
    height: 500
  contents:
    - x: 200
      y: 340
      type: file
    - x: 600
      y: 340
      type: link
      path: /Applications

win:
  target: nsis
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
